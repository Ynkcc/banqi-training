# =============================================================================
# banqi 统一训练配置模板（4x2 / 4x4 / 4x8 共用） — 模块化嵌套结构
# =============================================================================
# 注意：本文件仅作为生成 config.local.yaml 的「模板」，运行时不会被读取！
# 运行时的唯一配置来源是 config.local.yaml（被 .gitignore 忽略，不提交），
# 也可用环境变量 BANQI_CONFIG 指定其他 YAML 配置文件。
#
# 使用方式：
#   1. python -m banqi_training.config --write-template   # 生成 config.local.yaml
#   2. 编辑 config.local.yaml 中的参数
#   3. 运行训练脚本（环境变量优先级仍最高，可覆盖文件中的值）
#
# 配置结构与优先级：
#   - common: 跨变体公共模块，包含默认硬件/推理/监控/归档/评估等配置。
#   - 变体区块 (4x8 / 4x4 / 4x2): 覆写所属变体特有的超参和路径。
#   - GAMES_PER_ITER 由 NUM_WORKERS * GAMES_PER_WORKER 自动推导计算。
# =============================================================================

# ---------------------------------------------------------------------------
# 公共配置：与模型变体无关，三变体共用
# ---------------------------------------------------------------------------
common:
  # ---------------- gRPC 自对弈服务端 ----------------
  # grpc_server:
  #   ENABLED: false                # 是否启动后台 gRPC 自对弈服务端
  #   HOST: "0.0.0.0"               # 监听地址（供 Rust Worker 连接）
  #   PORT: 50051                   # 监听端口
  #   MAX_WORKERS: 10               # 服务端并发工作线程数
  #   WORKER_HOST: ""               # Rust Worker 的 gRPC serve 地址（训练端拉取样本用；空=不拉取）
  #   WORKER_PORT: 50052            # Rust Worker 的 gRPC serve 端口
  #   PULL_ENABLED: true            # 是否启动样本拉取线程（主动 PullGameData）

  # ---------------- 设备 ----------------
  device:
    INFER_DEVICE: ""              # 推理设备（cpu | cuda:0 | auto）
    TRAIN_DEVICE: ""              # 训练设备
    SELF_PLAY_DEVICE: "cpu"       # 自对弈推理设备（cpu | cuda）
    INFER_CPU_AUX_WORKERS: 0      # CPU 辅助推理线程数（0=关闭混合推理）
    INFER_CPU_FRACTION: 0.0       # 每批拆分给 CPU 推理的比例（0~1）
    INFER_MIN_SPLIT_BATCH: 0      # batch 小于该值时不拆分，直接走主设备

  # ---------------- 模型后端 ----------------
  model:
    MODEL_BACKEND: "torchscript"  # 推理格式："torchscript" | "onnx"
    ONNX_PROVIDERS: "CPUExecutionProvider"  # ONNX Runtime 执行提供者

  # ---------------- 路径基准 ----------------
  paths:
    OUTPUT_DIR: ""
    INIT_FROM_CHECKPOINT: ""      # 从指定 checkpoint 导入预训练权重（空=不导入）

  # ---------------- 自对弈公共参数 ----------------
  self_play:
    SELF_PLAY_PROCESSES: 2        # 自对弈进程数（INFER_SIDE=python 多进程时用）
    SELF_PLAY_BACKEND: "thread"   # 并发后端（保留兼容；实际推理侧由 INFER_SIDE 决定）
    INFER_SIDE: "rust"            # 推理执行侧："python"(多进程, Python run_python_match) | "rust"(多线程, Rust run_native_match 管理线程, 透传 num_threads)
    PLAYOUT_CAP_RANDOM_ENABLED: false # 关闭算力分配随机化：每局自对弈都用完整 MCTS_SIMS 搜索，保证数据质量
                                  # 开启前须同时把 FAST_SAMPLE_LOSS_WEIGHT 设为 >0，否则 Fast 样本（占 1-FULL_SEARCH_PROB）被完全丢弃
    FAST_MCTS_SIMS: 16            # Fast Search 模拟次数
    FULL_SEARCH_PROB: 0.25        # Full Search 出现概率 (25%)

  # ---------------- 训练公共超参 ----------------
  train:
    WEIGHT_DECAY: 1.0e-4          # 权重衰减
    EMA_ENABLED: true             # 是否启用权重指数滑动平均 (EMA)
    EMA_DECAY: 0.99               # EMA 滑动衰减率
    DATA_AUGMENT_ENABLED: true    # 是否启用数据增强
    DATA_AUGMENT_KEEP_ORIGINAL: true  # 是否保留原始样本
    DATA_AUGMENT_K: 1             # 每局随机抽取的对称变换个数（1=原行为；上限=变体非恒等变换数，4x2/4x8=3、4x4=7）
    MIN_NEW_SAMPLES_TO_TRAIN: 0   # 触发一次训练所需累计新样本数；0=自动 max(TRAIN_BATCH*EPOCHS, MAX_SAMPLE_BUFFER_SIZE//4)
                                  # 它同时决定每轮 batch 数，进而决定 LR 计划的推进速率（见 LR_DECAY_ROUNDS）
    LR_DECAY_ROUNDS: 0            # LR 余弦的时间跨度，以「训练轮数」表达：>0 时按当前每轮 batch 数
                                  # 自动折算成 batch 步数（改节流/TRAIN_BATCH/EPOCHS 后含义不变）；
                                  # =0 时沿用 LR_DECAY_STEPS（按 batch 计的历史口径）。>0 时 LR_DECAY_STEPS 被忽略
    RECENT_SAMPLE_ENABLED: true   # 批量聚焦训练时启用「新近优先」采样
    FAST_SAMPLE_LOSS_WEIGHT: 0.0  # Fast Search 样本的 loss 权重（0=不参与，即旧行为；Full 恒为 1.0）
                                  # 配合 PLAYOUT_CAP_RANDOM_ENABLED 使用：给 Fast 样本折扣权重，换来 PCR 的对局吞吐

  # ---------------- 局面重搜 reanalysis（可选） ----------------
  # 把 episode 携带的历史局面攒进位置池，周期性提交给调度器（SubmitReanalysis），
  # 由 collector 用当前 best 网络重跑 MCTS 刷新策略/价值目标。
  # 前置条件：collector 的 selfplay.collect_positions=true（否则 episode 不带快照）、
  # 调度器 SCHEDULER_REANALYSIS_INTERVAL_TASKS>0（否则提交被拒）。
  reanalysis:
    REANALYSIS_ENABLED: false          # 是否启用（关闭时不做任何池化与提交）
    REANALYSIS_POOL_SIZE: 20000        # 位置池容量（按位置条数，FIFO 淘汰最旧）
    REANALYSIS_BATCH_POSITIONS: 256    # 每次提交的位置条数（不足则继续攒）
    REANALYSIS_SUBMIT_EVERY_N_ROUNDS: 10  # 每 N 轮尝试提交一次
    REANALYSIS_MCTS_SIMS: 0            # 重搜模拟次数；0 = 用 collector 自对弈配置的默认值

  # ---------------- 检查点 ----------------
  checkpoint:
    CKPT_SAVE_EVERY: 1            # 完整 checkpoint (.pth) 落盘间隔轮次
    CKPT_EXPORT_EVERY: 10         # TorchScript/ONNX 导出间隔轮次

  # ---------------- 队列 ----------------
  queues:
    ARCHIVE_QUEUE_MAXSIZE: 256    # 归档队列容量
    DATA_QUEUE_MAXSIZE: 256       # 训练数据队列容量（公共默认 256）
    QUEUE_FETCH_BATCH: 8          # 队列批量抓取大小

  # ---------------- 监控 ----------------
  monitoring:
    MONITOR_ENABLED: true         # 是否启用系统监控
    MONITOR_INTERVAL: 10.0        # 采样间隔（秒）
    MONITOR_PER_CORE: false       # 是否按核输出监控
    MONITOR_CSV_PATH: null        # 监控 CSV 输出路径

  # ---------------- TensorBoard ----------------
  tensorboard:
    TENSORBOARD_ENABLED: true     # 是否启用 TensorBoard
    TENSORBOARD_LOG_SYS: true     # 是否记录系统指标

  # ---------------- Mongo 归档 ----------------
  archive:
    MONGO_URI: "mongodb://localhost:27017"
    COLLECTION: "games"
    ARCHIVE_BATCH: 32
    ARCHIVE_POLL_INTERVAL: 1.0
    ARCHIVE_ENABLED: false
    ARCHIVE_PREFILL_DIR: ""
    ARCHIVE_PREFILL_GAMES: 0      # 预填充对局数默认 0

  # ---------------- 对战评估（TensorBoard eval/*） ----------------
  eval_match:
    EVAL_MATCH_ROUNDS: 5          # 对战评估周期（轮次，0=关闭）
    EVAL_MATCH_GAMES: 20          # 每周期对弈局数
    EVAL_MATCH_OPPONENTS: ["random"]  # 对手列表（random / expectimax:<path.nnue> / .pt路径）
    EVAL_MATCH_VS_PREV: false      # 是否与上一轮模型对头守门。轮次间训练量不够，测试样本过少，暂时禁用
    EVAL_MATCH_STOP_WIN_RATE: 0.0  # 达到该胜率时停止训练（0=关闭）
    EVAL_MATCH_STOP_OPPONENT: ""   # 停机判定的对手（空=任一对手达标即停）

  # ---------------- 价值目标与漂移评估 ----------------
  value_target:
    VALUE_TARGET_MODE: "game_hp"     # 价值目标模式（mcts/game/completed_q/mixed/anneal/game_hp；mcts->game：向终局胜负真值学习）
                                  # game_hp：胜负用终局真值、平局改用终局子力差（4x2 平局占比过半，原目标恒为 0）
                                  # completed_q：用所选动作的 Q(s,a)（与根 V 同量纲同视角，短搜索下偏差更小）
    VALUE_MIX_GAME_WEIGHT: 0.5    # mixed 模式的终局价值权重 λ：target=(1-λ)*mcts_value+λ*game_result
    VALUE_TARGET_ANNEAL_ROUNDS: 0 # value 目标退火总轮数（0=关闭）
    VALUE_ANNEAL_START: 0.2       # 价值退火起始系数
    VALUE_ANNEAL_INCREMENT: 0.2   # 价值退火增量
    VALUE_ANNEAL_STEP_ROUNDS: 10  # 步进轮数
    VALUE_DRIFT_EVAL_ROUNDS: 5    # 价值漂移评估轮数（全变体统一为 5）
    VALUE_DRIFT_NUM_POSITIONS: 500  # 价值漂移评估位置数（默认 500）

  # ---------------- 策略目标变换（B2 策略目标锐化，可选；默认恒等） ----------------
  # 前提已实测（2026-09-16，4x2 语料诊断）：同代自对弈的 π' 并不软——归一化熵 0.41、
  # top1-top2 间隔中位 0.67、间隔<0.05 仅占 4%；而「记录动作」有 29.7% 不等于
  # argmax(π')（Gumbel 采样噪声的必然结果）。
  #   → POLICY_TARGET_ACTION_MIX（按记录动作做 one-hot）等于把探索噪声当正确答案，
  #     默认 0，**不建议启用**；
  #   → POLICY_TARGET_TEMPERATURE（温度锐化）只放大既有分布、不引入新信息，风险更低，
  #     但上限受「目标本已很尖」限制。两者都必须经闭环胜率验证，离线 top-1 不足以定论。
  # 另注：策略头评测口径已修正——训练日志同时输出「vs 记录动作（含噪）」与
  # 「vs 搜索偏好 π'」两套 Top-1/Top-2（eval.py::eval_policy_accuracy）。
  policy_target:
    POLICY_TARGET_TEMPERATURE: 1.0   # p' ∝ p^(1/T)，T<1 更尖；1.0 = 恒等（必须 > 0）
    POLICY_TARGET_ACTION_MIX: 0.0    # 与搜索动作 one-hot 混合比 ε∈[0,1]；0.0 = 恒等

  # ---------------- 血量差异价值头（离散分类，可选；**默认关闭，A/B 实测无收益**） ----------------
  # 实测结论（2026-09-16，4x2 两臂各 400 轮闭环 A/B，训练量差 1.8%）：
  #   M1 纯策略 vs random：无血量头 89.2%±1.11 vs 带血量头 88.6%±1.14（差 0.6 点，CI 重叠）；
  #   M2 搜索阶梯逐档一致；M3 直接对打相对自对照基线 −1.2%（−0.94σ，不显著）。
  #   → 按 A/B 方案 §2.5 规则 3 判定「无实质差异」，按工程成本去掉血量头。
  #   详见 docs/plans/AB血量头-结果-20260916.md。注意：该结论只覆盖 H1（辅助损失），
  #   H2（血量期望参与搜索效用，health_weight>0）未测。
  health_head:
    HEALTH_VALUE_HEAD_ENABLED: false   # 是否启用血量差异分类头
    HEALTH_LOSS_WEIGHT: 0.25           # 训练时血量头交叉熵 loss 权重 α
    HEALTH_GAUSS_SIGMA: 1.5            # HL-Gauss 标签平滑高斯标准差（桶）
    HEALTH_UTILITY_WEIGHT: 0.15        # MCTS 复合效用中血量期望权重 λ（0=禁用血量影响搜索，P3 使用）
    HEALTH_UTILITY_CONFIDENCE_EXP: 0.0 # λ 随 |v_win| 的自适应幂指数；0=常量 λ（P3 使用）

  # ---------------- 分布化价值头（离散分类，可选；**默认关闭，实测无收益**） ----------------
  # 机制：value 头由「tanh 标量 + MSE」改为「K 桶分布 + HL-Gauss 交叉熵」，把归一化
  # 价值 v∈[-1,1] 离散成 K 个等距桶；导出的 value 仍为 [B,1]（= 分布期望 Σp_i·c_i），
  # 因此 Rust 侧 ONNX/TorchScript 契约不随开关变化。
  #
  # 实测结论（2026-09-16，4x2 离线单变量 A/B：同一语料/初始化/采样顺序，3 种子配对增量）：
  #   - 只有 K=3（即 WDL 三分类，V=P(win)-P(loss)）一致为正，但幅度极小：
  #     Δauc +0.0014±0.0013（game）/ +0.0020±0.0010（game_hp）；
  #   - K=65 在 game 目标下无收益甚至略负（Δauc −0.0002 / −0.0017），
  #     仅 mse_health 稳定 −7%：细粒度分布只把「分数尺度」学得更好，与胜负排序无关；
  #   - 策略头 top-1/top-3 无变化（|Δ|≤0.003）；
  #   - 换目标口径 game_hp 亦无收益（auc 0.9204 vs game 0.9210），
  #     尽管和局子力差确实有信息（非零率 88%，std 0.255）。
  # 同一批数据上价值头 AUC=0.92 而策略头 top-1 仅 0.59 → 瓶颈在策略头对搜索的蒸馏，
  # 不在价值表示（见 docs/plans/20260914-4x2-后续探索方向.md 的 B2）。
  # 故默认关闭：继续打磨价值损失形式的预期收益极低。
  # 若将来重开此方向，只试 K=3 一种形式，并预设「无差异」的预期。
  value_dist:
    VALUE_DIST_ENABLED: false   # 是否启用分布化价值头（value loss: MSE → HL-Gauss CE）
    VALUE_DIST_BINS: 65         # 价值分桶数（须为 ≥3 的奇数）：3 = WDL 三分类（V=P(win)-P(loss)）
                                # 65 = 细粒度分布（仅配合 game_hp 这类连续目标才有意义）
    VALUE_GAUSS_SIGMA: 0.05     # HL-Gauss 平滑标准差，**价值单位**（内部按 2/(K-1) 桶宽换算）
                                # 0.05 ≈ K=65 时 1.6 桶、K=3 时近乎 one-hot；必须 > 0

  # ---------------- NNUE 蒸馏（独立旁路，可选） ----------------
  # 由采集端产出的 NNUE 类别 episode（Expectimax 强自对弈，稀疏特征）蒸馏训练
  # BanqiNNUE，周期导出 .nnue（outputs/nnue/<variant>_latest.nnue）供
  # expectimax 选手 / sidecar 热加载。数据经调度器 SCHEDULER_DATA_KIND=nnue
  # 下发采集；主闭环（ResNet 类别）不再顺带收集 NNUE 特征。
  nnue_distill:
    NNUE_DISTILL_ENABLED: false               # 是否启用主闭环 NNUE 蒸馏
    NNUE_DISTILL_DATA_DIR: "data/nnue"        # episode 归档目录（留档复训）
    NNUE_DISTILL_OUTPUT_DIR: "models/nnue"    # .nnue 导出目录
    NNUE_DISTILL_EVERY_N_CHECKPOINTS: 5       # 每 N 次 checkpoint 蒸馏一次
    NNUE_DISTILL_MIN_SAMPLES: 50000           # 触发蒸馏的最小累积样本数
    NNUE_VALUE_SOURCE: "completed_q"          # 搜索价值来源：completed_q | mcts_value
    NNUE_VALUE_WEIGHT: 0.7                    # 混合标签中搜索价值权重（终局回报 = 1-w）
    NNUE_FULL_ONLY: false                     # 仅使用 Full Search 样本
    NNUE_EPOCHS: 20                           # 蒸馏训练轮数
    NNUE_BATCH_SIZE: 256                      # 蒸馏训练批次
    NNUE_LR: 1.0e-3                           # 蒸馏学习率
    NNUE_MAX_SAMPLES: 2000000                 # 蒸馏样本池容量上限（FIFO 淘汰）

  # ---------------- Expectimax 强自对弈旁路（可选，默认关闭） ----------------
  # checkpoint 事件驱动的低频任务：expectimax 强搜索自对弈生成高质量
  # NNUE 记录（精调）+ 对局统计。强搜索成本高，仅作 sidecar。
  expectimax_sidecar:
    EXPECTIMAX_SIDECAR_ENABLED: false         # 是否启用 expectimax 旁路
    EXPECTIMAX_SIDECAR_EVERY_N_CHECKPOINTS: 20 # 每 N 次 checkpoint 触发一次
    EXPECTIMAX_SIDECAR_GAMES: 200             # 每次触发对局数
    EXPECTIMAX_SIDECAR_WORKERS: 4             # 局间并发 worker 数
    EXPECTIMAX_SIDECAR_NODE_BUDGET: 500000    # 每步搜索节点预算
    EXPECTIMAX_SIDECAR_MAX_DEPTH: 8           # 每步搜索最大深度

  # ---------------- 训练模式分流 ----------------
  train_mode:
    TRAIN_MODE: "selfplay"        # selfplay | archive | rule_selfplay
    ARCHIVE_TRAIN_DIR: ""
    ARCHIVE_TRAIN_GAMES: 0
    ARCHIVE_TRAIN_ROUNDS: 100
    rule_selfplay:
      RULE_SELFPLAY_TYPE: "heuristic"
      RULE_SELFPLAY_DEPTH: 3
      RULE_SELFPLAY_SIMS: 128
      RULE_SELFPLAY_GAMES: 500
      RULE_SELFPLAY_ROUNDS: 20
      RULE_SELFPLAY_CONCURRENCY: 8
      RULE_SELFPLAY_TEMPERATURE: 0.5
      RULE_SELFPLAY_BACKEND: "thread"

  # ---------------- 运行时限 ----------------
  runtime:
    MAX_RUNTIME_SECONDS: 0        # 运行时限（秒，0=不限时）

# ---------------------------------------------------------------------------
# 4x8 变体特有配置
# ---------------------------------------------------------------------------
4x8:
  self_play:
    PREDICT_BATCH: 128
    MCTS_SIMS: 128
    MAX_CONSIDERED_ACTIONS: 24
    NUM_WORKERS: 2
    GAMES_PER_WORKER: 50
    BATCH_CONCURRENCY: 8

  train:
    TRAIN_BATCH: 64
    LEARNING_RATE: 2.0e-4
    MIN_LR: 5.0e-6
    LR_DECAY_STEPS: 60000
    TRAIN_EPOCHS_PER_ROUND: 3
    MAX_SAMPLE_BUFFER_SIZE: 100000
    MIN_SAMPLES_TO_START: 1000

  data_augment:
    DATA_AUGMENT_TRANSFORMS: "hflip,vflip,rot180"

  paths:
    OUTPUT_DIR: "outputs/4x8"
    MODEL_PATH: "outputs/4x8/checkpoints/banqi_model_latest.pt"
    STATE_DICT_PATH: "outputs/4x8/checkpoints/banqi_model_latest.pth"
    ONNX_PATH: "outputs/4x8/checkpoints/banqi_model_latest.onnx"
    # 血量差异头模型（HEALTH_VALUE_HEAD_ENABLED=true 时使用，与标准模型文件物理隔离）
    HEALTH_MODEL_PATH: "outputs/4x8/checkpoints/banqi_model_latest_health.pt"
    HEALTH_STATE_DICT_PATH: "outputs/4x8/checkpoints/banqi_model_latest_health.pth"
    HEALTH_ONNX_PATH: "outputs/4x8/checkpoints/banqi_model_latest_health.onnx"
    TENSORBOARD_LOG_DIR: "outputs/4x8/tensorboard"

  archive:
    DB_NAME: "banqi_training"

# ---------------------------------------------------------------------------
# 4x4 变体特有配置
# ---------------------------------------------------------------------------
4x4:
  self_play:
    PREDICT_BATCH: 128
    MCTS_SIMS: 512
    MAX_CONSIDERED_ACTIONS: 16
    NUM_WORKERS: 4
    GAMES_PER_WORKER: 15
    BATCH_CONCURRENCY: 16

  train:
    TRAIN_BATCH: 128
    LEARNING_RATE: 1.0e-4
    MIN_LR: 1.0e-5
    LR_DECAY_STEPS: 300000
    TRAIN_EPOCHS_PER_ROUND: 2
    MAX_SAMPLE_BUFFER_SIZE: 32000
    MIN_SAMPLES_TO_START: 1000

  data_augment:
    DATA_AUGMENT_TRANSFORMS: "hflip,vflip,rot180,rot90,rot270,diag,anti_diag"

  paths:
    OUTPUT_DIR: "outputs/4x4"
    MODEL_PATH: "outputs/4x4/checkpoints/last.pt"
    STATE_DICT_PATH: "outputs/4x4/checkpoints/last.ckpt"
    ONNX_PATH: "outputs/4x4/checkpoints/last.onnx"
    HEALTH_MODEL_PATH: "outputs/4x4/checkpoints/last_health.pt"
    HEALTH_STATE_DICT_PATH: "outputs/4x4/checkpoints/last_health.ckpt"
    HEALTH_ONNX_PATH: "outputs/4x4/checkpoints/last_health.onnx"
    TENSORBOARD_LOG_DIR: "outputs/4x4/tensorboard"

  archive:
    DB_NAME: "banqi_4x4"
    ARCHIVE_PREFILL_GAMES: 400

# ---------------------------------------------------------------------------
# 4x2 变体特有配置
# ---------------------------------------------------------------------------
4x2:
  self_play:
    PREDICT_BATCH: 64
    MCTS_SIMS: 256
    MAX_CONSIDERED_ACTIONS: 16
    NUM_WORKERS: 1
    GAMES_PER_WORKER: 2
    BATCH_CONCURRENCY: 16

  train:
    TRAIN_BATCH: 128
    LEARNING_RATE: 1.0e-4
    MIN_LR: 1.0e-5
    LR_DECAY_STEPS: 40000
    TRAIN_EPOCHS_PER_ROUND: 2
    MAX_SAMPLE_BUFFER_SIZE: 20000
    MIN_SAMPLES_TO_START: 2000

  data_augment:
    DATA_AUGMENT_TRANSFORMS: "hflip,vflip,rot180"

  paths:
    OUTPUT_DIR: "outputs/4x2"
    MODEL_PATH: "outputs/4x2/checkpoints/last.pt"
    STATE_DICT_PATH: "outputs/4x2/checkpoints/last.pth"
    ONNX_PATH: "outputs/4x2/checkpoints/last.onnx"
    HEALTH_MODEL_PATH: "outputs/4x2/checkpoints/last_health.pt"
    HEALTH_STATE_DICT_PATH: "outputs/4x2/checkpoints/last_health.pth"
    HEALTH_ONNX_PATH: "outputs/4x2/checkpoints/last_health.onnx"
    TENSORBOARD_LOG_DIR: "outputs/4x2/tensorboard"

  archive:
    DB_NAME: "banqi_mini"
    ARCHIVE_ENABLED: false

  health_head:
    HEALTH_VALUE_HEAD_ENABLED: false   # 默认关闭：三变体网络语义统一为「策略 + 价值」两头，跨变体迁移/评测基线一致；需实验时显式开启
    HEALTH_LOSS_WEIGHT: 0.25           # 血量头交叉熵 loss 权重 α
    HEALTH_UTILITY_WEIGHT: 0.15        # MCTS 复合效用中血量期望权重 λ
    HEALTH_UTILITY_CONFIDENCE_EXP: 0.0 # λ 自适应指数；0=常量 λ

  runtime:
    MAX_RUNTIME_SECONDS: 0
